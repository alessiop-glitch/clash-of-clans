<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Pannello Admin - alessiopuzzolo</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        h1 {
            color: #f39c12;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #333;
        }

        .btn-approve {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-reject {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>Pannello Amministratore (alessiopuzzolo)</h1>
    <div id="login-box">
        <input type="password" id="pass" placeholder="Password Admin (admin123)">
        <button onclick="login()">Accedi</button>
    </div>

    <div id="admin-panel" style="display:none;">
        <h2>Richieste Acquisto in Sospeso</h2>
        <table>
            <thead>
                <tr>
                    <th>ID Ordine</th>
                    <th>Utente</th>
                    <th>Oggetto</th>
                    <th>Quantità</th>
                    <th>Azione</th>
                </tr>
            </thead>
            <tbody id="orders-list"></tbody>
        </table>
    </div>

    <script>
        // INSERISCI L'URL DEL TUO SERVER RENDER
        const RENDER_URL = "https://clash-of-clans-y9lb.onrender.com"; // <-- INSERISCI IL TUO URL DI RENDER
        const socket = io(RENDER_URL);

        function login() {
            const password = document.getElementById('pass').value;
            socket.emit('registerAdmin', { username: 'alessiopuzzolo', password: password });
        }

        socket.on('pendingList', (list) => {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            const tbody = document.getElementById('orders-list');
            tbody.innerHTML = '';

            list.forEach(order => {
                tbody.innerHTML += `
          <tr>
            <td>${order.id}</td>
            <td>${order.username}</td>
            <td>${order.item}</td>
            <td>${order.amount}</td>
            <td>
              <button class="btn-approve" onclick="process('${order.id}', 'APPROVE')">Accetta</button>
              <button class="btn-reject" onclick="process('${order.id}', 'REJECT')">Rifiuta</button>
            </td>
          </tr>
        `;
            });
        });

        function process(purchaseId, action) {
            socket.emit('processPurchase', { purchaseId, action });
        }
    </script>
</body>

</html>
